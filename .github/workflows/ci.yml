name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...
      # Shift left: CVE em dependência (go.sum) quebra o PR, antes de existir imagem.
      # O trivy da imagem continua no job "image" (pega também a base e o binário final).
      - name: trivy fs (dependências)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push no GHCR
      id-token: write   # cosign keyless (OIDC -> Sigstore)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
      - name: trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  # Continuous Delivery para STG: o CI só escreve no repo de deploy, quem aplica é o Argo CD.
  # Toda versão que passa no CI vai para stg; prod só por PR de promoção (sample-app-deploy).
  # GitHub Environment "staging": guarda o DEPLOY_REPO_TOKEN (secret de ambiente, não do repo)
  # e registra o histórico de deploys. Ativação: variable AUTO_DEPLOY_STG=true no environment.
  bump-stg:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://github.com/${{ github.repository_owner }}/sample-app-deploy/blob/main/envs/eks-stg/values.yaml
    permissions:
      contents: read
    steps:
      - name: desligado?
        if: vars.AUTO_DEPLOY_STG != 'true'
        run: echo "::notice::AUTO_DEPLOY_STG != true no environment staging; nada a fazer" && exit 0
      - uses: actions/checkout@v7
        if: vars.AUTO_DEPLOY_STG == 'true'
        with:
          repository: ${{ github.repository_owner }}/sample-app-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
      - name: atualiza a tag em envs/eks-stg
        if: vars.AUTO_DEPLOY_STG == 'true'
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' envs/eks-stg/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(eks-stg): sample-app ${TAG}"
          git push
