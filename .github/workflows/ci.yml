name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...
      # Shift left: CVE em dependência (go.sum) quebra o PR, antes de existir imagem.
      # O trivy da imagem continua no job "image" (pega também a base e o binário final).
      - name: trivy fs (dependências)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push no GHCR
      id-token: write   # cosign keyless (OIDC -> Sigstore)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
      - name: trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  # Continuous Delivery para DEV: o CI só escreve no repo de deploy, quem aplica é o Argo CD.
  # Ative em Settings > Variables: AUTO_DEPLOY_DEV=true (depois de criar o secret DEPLOY_REPO_TOKEN).
  bump-dev:
    needs: image
    if: vars.AUTO_DEPLOY_DEV == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sample-app-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
      - name: atualiza a tag em envs/kind-dev
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' envs/kind-dev/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(kind-dev): sample-app ${TAG}"
          git push
